<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page / Storage / Cookies</title>
    <link rel="stylesheet" href="inspector.css" />
  </head>
  <body>
    <main class="app">
      <div class="mode-tabs" role="group">
        <button id="metadataModeButton" class="mode-tab active" type="button">
          Page
        </button>
        <button id="storageModeButton" class="mode-tab" type="button">
          Storage
        </button>
        <button id="cookiesModeButton" class="mode-tab" type="button">
          Cookies
        </button>
      </div>
      <section
        id="metadataView"
        class="metadata-view"
        aria-label="Page metadata"
      ></section>
      <div id="storageWorkspace" class="workspace" hidden>
        <aside class="sidebar">
          <div class="toolbar">
            <input
              id="filterInput"
              type="search"
              placeholder="Filter key or value"
            />
          </div>
          <div class="summary">
            <span id="countLabel">0 storage items</span>
          </div>
          <ol id="entryList" class="entry-list"></ol>
        </aside>
        <section class="detail">
          <header class="detail-header">
            <div>
              <div id="detailTitle" class="detail-title">
                No storage item selected
              </div>
              <div id="detailMeta" class="detail-meta">
                Select a normal page tab to view storage.
              </div>
            </div>
            <input
              id="jsonFilterInput"
              class="json-filter"
              type="search"
              placeholder="Filter JSON keys or values"
              aria-label="Filter JSON value"
            />
            <div class="tabs" role="group">
              <button id="toggleTreeButton" class="tab" type="button">
                Collapse
              </button>
              <button id="editStorageButton" class="tab" type="button">
                Edit
              </button>
              <button id="deleteStorageButton" class="tab" type="button">
                Delete
              </button>
              <button
                id="rawButton"
                class="tab"
                type="button"
                aria-pressed="false"
              >
                Raw
              </button>
            </div>
          </header>
          <div id="treeView" class="viewer tree-view"></div>
        </section>
      </div>
    </main>
    <dialog id="storageEditor" aria-labelledby="storageEditorTitle">
      <h2 id="storageEditorTitle">Edit value</h2>
      <textarea
        id="storageJsonInput"
        aria-label="Value"
        spellcheck="false"
      ></textarea>
      <p id="storageEditStatus" role="status"></p>
      <div class="editor-actions">
        <button id="cancelStorageEdit" type="button">Cancel</button>
        <button id="saveStorageEdit" type="button">Save</button>
      </div>
    </dialog>
    <script src="cookie-store.js"></script>
    <script src="image-previews.js"></script>
    <script src="inspector.js"></script>
  </body>
</html>
