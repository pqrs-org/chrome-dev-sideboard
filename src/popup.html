<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Title Bar</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon-48.png" width="32" height="32" alt="" />
        <div>
          <h1>Page Title Bar</h1>
          <p>Show page titles on selected websites.</p>
        </div>
      </header>

      <section class="current-site">
        <div class="current-page">
          <strong id="title">Loading…</strong>
          <small id="url"></small>
        </div>
        <button id="toggle" class="secondary" type="button" disabled>
          Loading…
        </button>
      </section>

      <form id="form">
        <section>
          <label for="patterns">URL patterns to show the title chip</label>
          <textarea
            id="patterns"
            rows="6"
            spellcheck="false"
            placeholder="https://example.sharepoint.com/*"
          ></textarea>
          <p class="hint">
            Enter one Chrome match pattern per line.<br />Example:
            <code>https://*.office.com/*</code>
          </p>
        </section>

        <section class="appearance-section">
          <div class="section-title">Appearance</div>
          <div class="grid">
            <label
              >Font size (px)
              <input id="fontSize" type="number" min="10" max="48" required />
            </label>
            <label
              >Background
              <input id="backgroundColor" type="color" />
            </label>
            <label
              >Text
              <input id="textColor" type="color" />
            </label>
            <label
              >Border
              <input id="borderColor" type="color" />
            </label>
          </div>
          <p class="hint">
            Drag the title chip to save its position for this site.
          </p>
        </section>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
